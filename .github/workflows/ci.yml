name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Simulation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Formatting
        run: |
          cargo fmt --check --manifest-path core/Cargo.toml
          cargo fmt --check --manifest-path windows/Cargo.toml
          cargo fmt --check --manifest-path linux/Cargo.toml
      - name: Tests
        run: cargo test --locked --manifest-path core/Cargo.toml

  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo build --locked --release --bin Snowhush --manifest-path windows/Cargo.toml

  linux:
    name: Linux app
    # An older glibc than ubuntu-latest has, so the packages it leaves run on older distributions too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -q && sudo apt-get install -y -q libwayland-dev rpm file
      - run: cargo build --locked --release --manifest-path linux/Cargo.toml
      - run: linux/packaging/package.sh linux/target/release/snowhush dist
      - uses: actions/upload-artifact@v7
        with:
          name: snowhush-linux-x86_64
          path: dist

  mac:
    name: Mac app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and package Snowhush
        run: |
          ./build.sh
          stage="$(mktemp -d)"
          ditto build/Snowhush.app "$stage/Snowhush.app"
          hdiutil create -volname Snowhush -srcfolder "$stage" -format UDZO build/Snowhush.dmg
          hdiutil verify build/Snowhush.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: Snowhush-macOS
          path: build/Snowhush.dmg
          if-no-files-found: error
